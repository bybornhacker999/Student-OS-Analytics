<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student OS Analytics</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Student Analytics</h1>
<div class="controls">

    <div class="time-selector">

        <button class="active">Day</button>
        <button>Week</button>
        <button>Month</button>
        <button>Year</button>

    </div>

    <div class="subject-dropdown">

        <button id="subjectButton">
            Subjects ▼
        </button>

        <div id="subjectMenu" class="subject-menu">

            <div class="subject-pill active" data-subject="Physics">🔵 Physics</div>

            <div class="subject-pill active" data-subject="Chemistry">🟠 Chemistry</div>

            <div class="subject-pill active" data-subject="HigherMath">🟣 Higher Math</div>

            <div class="subject-pill active" data-subject="Biology">⚪ Biology</div>

            <div class="subject-pill active" data-subject="Bangla">🟢 Bangla</div>

            <div class="subject-pill active" data-subject="English">🔴 English</div>

        </div>

    </div>

</div>

    </div>

    <div id="chart"></div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
